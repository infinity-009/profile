<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Avatar - Full Hand Tracking</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
        overflow: hidden;
        height: 100vh;
        font-family: 'Inter', system-ui, sans-serif;
      }
      #avatar-canvas { width: 100vw; height: 100vh; display: block; }
      #loading {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        z-index: 100; transition: opacity 0.5s ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      .spinner {
        width: 60px; height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-left-color: #00ff88; border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .loading-text { color: rgba(255, 255, 255, 0.8); margin-top: 20px; font-size: 14px; }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      #webcam { position: fixed; top: -9999px; left: -9999px; }
      #debug-video {
        position: fixed; bottom: 10px; right: 10px;
        width: 200px; height: 150px;
        border: 2px solid #00ff88; border-radius: 8px; z-index: 50;
      }
      #status {
        position: fixed; top: 10px; left: 10px;
        color: #00ff88; font-size: 12px; z-index: 50;
        background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <p class="loading-text" id="loading-text">Initializing...</p>
    </div>
    
    <div id="status">Tracking: Initializing...</div>
    <video id="webcam" playsinline autoplay muted></video>
    <video id="debug-video" playsinline autoplay muted></video>
    <canvas id="avatar-canvas"></canvas>
    
    <!-- Three.js and VRM -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.11/lib/three-vrm.js"></script>
    
    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1635989137/holistic.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    
    <!-- Kalidokit -->
    <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1/dist/kalidokit.umd.js"></script>
    
    <!-- Application Modules -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
