<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Avatar - Full Hand Tracking</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
        overflow: hidden;
        height: 100vh;
        font-family: 'Inter', system-ui, sans-serif;
      }
      #avatar-canvas { width: 100vw; height: 100vh; display: block; }
      #loading {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        z-index: 100; transition: opacity 0.5s ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      .spinner {
        width: 60px; height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-left-color: #00ff88; border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .loading-text { color: rgba(255, 255, 255, 0.8); margin-top: 20px; font-size: 14px; }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      #webcam { position: fixed; top: -9999px; left: -9999px; }
      #debug-video {
        position: fixed; bottom: 10px; right: 10px;
        width: 200px; height: 150px;
        border: 2px solid #00ff88; border-radius: 8px; z-index: 50;
      }
      #status {
        position: fixed; top: 10px; left: 10px;
        color: #00ff88; font-size: 12px; z-index: 50;
        background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <p class="loading-text" id="loading-text">Initializing...</p>
    </div>
    
    <div id="status">Tracking: Initializing...</div>
    <video id="webcam" playsinline autoplay muted></video>
    <video id="debug-video" playsinline autoplay muted></video>
    <canvas id="avatar-canvas"></canvas>
    
    <!-- Three.js and VRM -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.11/lib/three-vrm.js"></script>
    
    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1635989137/holistic.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    
    <!-- Kalidokit -->
    <script src="https://cdn.jsdelivr.net/npm/kalidokit@1.1/dist/kalidokit.umd.js"></script>
    
    <script>
      // Import helpers from Kalidokit
      const remap = Kalidokit.Utils.remap;
      const clamp = Kalidokit.Utils.clamp;
      const lerp = Kalidokit.Vector.lerp;
      
      let currentVrm = null;
      let videoElement = null;
      
      // ==================== DIRECT RESPONSE (NO SMOOTHING) ====================
      // Minimal smoothing for responsive movement
      const SMOOTH_AMOUNT = 0.1;  // Very low - almost direct
      const POSITION_SMOOTH = 0.1;
      
      // Dead zone threshold - ignore tiny movements
      const DEAD_ZONE = 0.002;  // Very small for maximum sensitivity
      
      // Direct rotation - minimal interpolation
      function smoothRotation(current, target, amount = SMOOTH_AMOUNT) {
        // Return target directly for instant response
        return target || current;
      }
      
      // Store values for reference (not smoothing)
      const smoothedValues = {
        face: null,
        pose: null,
        leftHand: null,
        rightHand: null
      };
      
      // Apply dead zone to filter tiny jittery movements
      function applyDeadZone(value, threshold = DEAD_ZONE) {
        return Math.abs(value) < threshold ? 0 : value;
      }
      
      // Rig rotation helper - FAST direct response
      const rigRotation = (name, rotation = { x: 0, y: 0, z: 0 }, dampener = 1, lerpAmount = 0.7) => {
        if (!currentVrm) return;
        if (!rotation) return;
        
        const Part = currentVrm.humanoid.getBoneNode(THREE_VRM.VRMSchema.HumanoidBoneName[name]);
        if (!Part) return;
        
        // Apply dead zone filtering
        const filteredRotation = {
          x: applyDeadZone(rotation.x),
          y: applyDeadZone(rotation.y),
          z: applyDeadZone(rotation.z)
        };
        
        let euler = new THREE.Euler(
          filteredRotation.x * dampener,
          filteredRotation.y * dampener,
          filteredRotation.z * dampener,
          rotation.rotationOrder || "XYZ"
        );
        let quaternion = new THREE.Quaternion().setFromEuler(euler);
        Part.quaternion.slerp(quaternion, lerpAmount);
      };
      
      // Floor height constant - avatar cannot go below this
      const FLOOR_Y = 0;
      
      // Rig position helper - with improved smoothing and floor clamping
      const rigPosition = (name, position = { x: 0, y: 0, z: 0 }, dampener = 1, lerpAmount = 0.1) => {
        if (!currentVrm) return;
        if (!position) return;
        
        const Part = currentVrm.humanoid.getBoneNode(THREE_VRM.VRMSchema.HumanoidBoneName[name]);
        if (!Part) return;
        
        // Clamp Y position to floor level (prevent going below floor)
        let clampedY = Math.max(applyDeadZone(position.y) * dampener, FLOOR_Y);
        
        let vector = new THREE.Vector3(
          applyDeadZone(position.x) * dampener,
          clampedY,
          applyDeadZone(position.z) * dampener
        );
        Part.position.lerp(vector, lerpAmount);
      };
      
      // Old look target for smooth eye movement
      let oldLookTarget = new THREE.Euler();
      
      // Rig face helper
      const rigFace = (riggedFace) => {
        if (!currentVrm || !riggedFace) return;
        
        // Neck/Head rotation
        rigRotation("Neck", riggedFace.head, 0.7);
        
        // Blendshapes
        const Blendshape = currentVrm.blendShapeProxy;
        const PresetName = THREE_VRM.VRMSchema.BlendShapePresetName;
        
        if (Blendshape) {
          // Blink - get raw eye values from Kalidokit
          // eye.l and eye.r are 0-1, need to invert (0 = open, 1 = closed)
          let leftBlink = 1 - riggedFace.eye.l;
          let rightBlink = 1 - riggedFace.eye.r;
          
          // Apply blink directly
          Blendshape.setValue(PresetName.BlinkL, leftBlink);
          Blendshape.setValue(PresetName.BlinkR, rightBlink);
          
          // Mouth shapes - vowel sounds (A, I, U, E, O)
          // Apply with smoothing for natural movement
          const mouthLerp = 0.5;  // Higher = faster response
          Blendshape.setValue(PresetName.A, lerp(Blendshape.getValue(PresetName.A), riggedFace.mouth.shape.A, mouthLerp));
          Blendshape.setValue(PresetName.I, lerp(Blendshape.getValue(PresetName.I), riggedFace.mouth.shape.I, mouthLerp));
          Blendshape.setValue(PresetName.U, lerp(Blendshape.getValue(PresetName.U), riggedFace.mouth.shape.U, mouthLerp));
          Blendshape.setValue(PresetName.E, lerp(Blendshape.getValue(PresetName.E), riggedFace.mouth.shape.E, mouthLerp));
          Blendshape.setValue(PresetName.O, lerp(Blendshape.getValue(PresetName.O), riggedFace.mouth.shape.O, mouthLerp));
          
          // Smile detection - use "I" mouth shape as smile indicator
          // When mouth corners go up (I shape), apply Joy/Fun expression
          const smileAmount = riggedFace.mouth.shape.I * 0.7;
          Blendshape.setValue(PresetName.Joy, lerp(Blendshape.getValue(PresetName.Joy) || 0, smileAmount, mouthLerp));
          
          // Also try Fun preset as alternative smile
          try {
            Blendshape.setValue(PresetName.Fun, lerp(Blendshape.getValue(PresetName.Fun) || 0, smileAmount, mouthLerp));
          } catch(e) {}
        }
        
        // Pupils
        if (currentVrm.lookAt) {
          let lookTarget = new THREE.Euler(
            lerp(oldLookTarget.x, riggedFace.pupil.y, 0.4),
            lerp(oldLookTarget.y, riggedFace.pupil.x, 0.4),
            0,
            "XYZ"
          );
          oldLookTarget.copy(lookTarget);
          currentVrm.lookAt.applyer.lookAt(lookTarget);
        }
      };
      
      // Main animate function - called on each holistic result
      const animateVRM = (results) => {
        if (!currentVrm) return;
        
        let status = [];
        let riggedPose, riggedLeftHand, riggedRightHand, riggedFace;
        
        const faceLandmarks = results.faceLandmarks;
        // Pose 3D Landmarks are with respect to Hip distance in meters
        const pose3DLandmarks = results.ea;
        // Pose 2D landmarks are with respect to videoWidth and videoHeight
        const pose2DLandmarks = results.poseLandmarks;
        
        // IMPORTANT: Hand landmarks are REVERSED in MediaPipe Holistic!
        // What MediaPipe calls "rightHandLandmarks" is actually your LEFT hand visually
        const leftHandLandmarks = results.rightHandLandmarks;
        const rightHandLandmarks = results.leftHandLandmarks;
        
        // ==================== FACE ====================
        if (faceLandmarks) {
          status.push('Face ✓');
          let rawFace = Kalidokit.Face.solve(faceLandmarks, {
            runtime: "mediapipe",
            video: videoElement,
            smoothBlink: false,  // Disable Kalidokit's built-in smoothing
            blinkSettings: [0.25, 0.75]  // More sensitive blink detection
          });
          
          // Process face data
          if (rawFace) {
            // Use RAW eye values for blinking (no smoothing - blinks should be instant)
            const rawEyes = { l: rawFace.eye.l, r: rawFace.eye.r };
            
            // Smooth other face data
            if (smoothedValues.face) {
              riggedFace = {
                head: smoothRotation(smoothedValues.face.head, rawFace.head, SMOOTH_AMOUNT),
                eye: rawEyes,  // Use raw values directly for responsive blinking
                mouth: rawFace.mouth,
                pupil: {
                  x: lerp(smoothedValues.face.pupil?.x || rawFace.pupil.x, rawFace.pupil.x, 0.5),
                  y: lerp(smoothedValues.face.pupil?.y || rawFace.pupil.y, rawFace.pupil.y, 0.5)
                },
                brow: rawFace.brow
              };
            } else {
              riggedFace = rawFace;
            }
            smoothedValues.face = riggedFace;
            rigFace(riggedFace);
          }
        }
        
        // ==================== POSE (Body/Arms) ====================
        if (pose2DLandmarks && pose3DLandmarks) {
          status.push('Pose ✓');
          riggedPose = Kalidokit.Pose.solve(pose3DLandmarks, pose2DLandmarks, {
            runtime: "mediapipe",
            video: videoElement
          });
          
          if (riggedPose) {
            // Smooth pose data
            if (smoothedValues.pose) {
              riggedPose = {
                Hips: {
                  rotation: smoothRotation(smoothedValues.pose.Hips?.rotation, riggedPose.Hips.rotation, SMOOTH_AMOUNT),
                  position: {
                    x: lerp(riggedPose.Hips.position.x, smoothedValues.pose.Hips?.position?.x || 0, POSITION_SMOOTH),
                    y: lerp(riggedPose.Hips.position.y, smoothedValues.pose.Hips?.position?.y || 0, POSITION_SMOOTH),
                    z: lerp(riggedPose.Hips.position.z, smoothedValues.pose.Hips?.position?.z || 0, POSITION_SMOOTH)
                  }
                },
                Spine: smoothRotation(smoothedValues.pose.Spine, riggedPose.Spine, SMOOTH_AMOUNT),
                RightUpperArm: smoothRotation(smoothedValues.pose.RightUpperArm, riggedPose.RightUpperArm, SMOOTH_AMOUNT),
                RightLowerArm: smoothRotation(smoothedValues.pose.RightLowerArm, riggedPose.RightLowerArm, SMOOTH_AMOUNT),
                RightHand: smoothRotation(smoothedValues.pose.RightHand, riggedPose.RightHand, SMOOTH_AMOUNT),
                LeftUpperArm: smoothRotation(smoothedValues.pose.LeftUpperArm, riggedPose.LeftUpperArm, SMOOTH_AMOUNT),
                LeftLowerArm: smoothRotation(smoothedValues.pose.LeftLowerArm, riggedPose.LeftLowerArm, SMOOTH_AMOUNT),
                LeftHand: smoothRotation(smoothedValues.pose.LeftHand, riggedPose.LeftHand, SMOOTH_AMOUNT),
                LeftUpperLeg: smoothRotation(smoothedValues.pose.LeftUpperLeg, riggedPose.LeftUpperLeg, SMOOTH_AMOUNT),
                LeftLowerLeg: smoothRotation(smoothedValues.pose.LeftLowerLeg, riggedPose.LeftLowerLeg, SMOOTH_AMOUNT),
                RightUpperLeg: smoothRotation(smoothedValues.pose.RightUpperLeg, riggedPose.RightUpperLeg, SMOOTH_AMOUNT),
                RightLowerLeg: smoothRotation(smoothedValues.pose.RightLowerLeg, riggedPose.RightLowerLeg, SMOOTH_AMOUNT)
              };
            }
            smoothedValues.pose = riggedPose;
            
            // LOWER BODY: Completely fixed - no movement at all
            // Hips, legs, feet stay in default T-pose/standing position
            // Do NOT apply any rotation or position to Hips
            
            // UPPER BODY: Only spine and chest for slight torso movement
            rigRotation("Chest", riggedPose.Spine, 0.15, 0.6);
            rigRotation("Spine", riggedPose.Spine, 0.2, 0.6);
            
            // Arms - fast and responsive
            rigRotation("RightUpperArm", riggedPose.RightUpperArm, 1, 0.8);
            rigRotation("RightLowerArm", riggedPose.RightLowerArm, 1, 0.8);
            rigRotation("LeftUpperArm", riggedPose.LeftUpperArm, 1, 0.8);
            rigRotation("LeftLowerArm", riggedPose.LeftLowerArm, 1, 0.8);
            
            // Legs - FIXED standing position (no tracking)
            // Feet stay planted on floor - do not apply leg rotations
          }
        }
        
        // ==================== LEFT HAND ====================
        if (leftHandLandmarks) {
          status.push('L-Hand ✓');
          let rawLeftHand = Kalidokit.Hand.solve(leftHandLandmarks, "Left");
          
          // Smooth hand data
          if (rawLeftHand) {
            if (smoothedValues.leftHand) {
              riggedLeftHand = {};
              for (const key in rawLeftHand) {
                riggedLeftHand[key] = smoothRotation(smoothedValues.leftHand[key], rawLeftHand[key], SMOOTH_AMOUNT);
              }
            } else {
              riggedLeftHand = rawLeftHand;
            }
            smoothedValues.leftHand = riggedLeftHand;
          }
          
          if (riggedLeftHand && riggedPose) {
            // Wrist - combine pose Z with hand X/Y
            rigRotation("LeftHand", {
              z: riggedPose.LeftHand?.z || 0,
              y: riggedLeftHand.LeftWrist?.y || 0,
              x: riggedLeftHand.LeftWrist?.x || 0
            }, 1, 0.8);
            
            // Fingers with smoother lerp
            rigRotation("LeftRingProximal", riggedLeftHand.LeftRingProximal, 1, 0.8);
            rigRotation("LeftRingIntermediate", riggedLeftHand.LeftRingIntermediate, 1, 0.8);
            rigRotation("LeftRingDistal", riggedLeftHand.LeftRingDistal, 1, 0.8);
            rigRotation("LeftIndexProximal", riggedLeftHand.LeftIndexProximal, 1, 0.8);
            rigRotation("LeftIndexIntermediate", riggedLeftHand.LeftIndexIntermediate, 1, 0.8);
            rigRotation("LeftIndexDistal", riggedLeftHand.LeftIndexDistal, 1, 0.8);
            rigRotation("LeftMiddleProximal", riggedLeftHand.LeftMiddleProximal, 1, 0.8);
            rigRotation("LeftMiddleIntermediate", riggedLeftHand.LeftMiddleIntermediate, 1, 0.8);
            rigRotation("LeftMiddleDistal", riggedLeftHand.LeftMiddleDistal, 1, 0.8);
            rigRotation("LeftThumbProximal", riggedLeftHand.LeftThumbProximal, 1, 0.8);
            rigRotation("LeftThumbIntermediate", riggedLeftHand.LeftThumbIntermediate, 1, 0.8);
            rigRotation("LeftThumbDistal", riggedLeftHand.LeftThumbDistal, 1, 0.8);
            rigRotation("LeftLittleProximal", riggedLeftHand.LeftLittleProximal, 1, 0.8);
            rigRotation("LeftLittleIntermediate", riggedLeftHand.LeftLittleIntermediate, 1, 0.8);
            rigRotation("LeftLittleDistal", riggedLeftHand.LeftLittleDistal, 1, 0.8);
          }
        }
        
        // ==================== RIGHT HAND ====================
        if (rightHandLandmarks) {
          status.push('R-Hand ✓');
          let rawRightHand = Kalidokit.Hand.solve(rightHandLandmarks, "Right");
          
          // Smooth hand data
          if (rawRightHand) {
            if (smoothedValues.rightHand) {
              riggedRightHand = {};
              for (const key in rawRightHand) {
                riggedRightHand[key] = smoothRotation(smoothedValues.rightHand[key], rawRightHand[key], SMOOTH_AMOUNT);
              }
            } else {
              riggedRightHand = rawRightHand;
            }
            smoothedValues.rightHand = riggedRightHand;
          }
          
          if (riggedRightHand && riggedPose) {
            // Wrist - combine pose Z with hand X/Y
            rigRotation("RightHand", {
              z: riggedPose.RightHand?.z || 0,
              y: riggedRightHand.RightWrist?.y || 0,
              x: riggedRightHand.RightWrist?.x || 0
            }, 1, 0.8);
            
            // Fingers with smoother lerp
            rigRotation("RightRingProximal", riggedRightHand.RightRingProximal, 1, 0.8);
            rigRotation("RightRingIntermediate", riggedRightHand.RightRingIntermediate, 1, 0.8);
            rigRotation("RightRingDistal", riggedRightHand.RightRingDistal, 1, 0.8);
            rigRotation("RightIndexProximal", riggedRightHand.RightIndexProximal, 1, 0.8);
            rigRotation("RightIndexIntermediate", riggedRightHand.RightIndexIntermediate, 1, 0.8);
            rigRotation("RightIndexDistal", riggedRightHand.RightIndexDistal, 1, 0.8);
            rigRotation("RightMiddleProximal", riggedRightHand.RightMiddleProximal, 1, 0.8);
            rigRotation("RightMiddleIntermediate", riggedRightHand.RightMiddleIntermediate, 1, 0.8);
            rigRotation("RightMiddleDistal", riggedRightHand.RightMiddleDistal, 1, 0.8);
            rigRotation("RightThumbProximal", riggedRightHand.RightThumbProximal, 1, 0.8);
            rigRotation("RightThumbIntermediate", riggedRightHand.RightThumbIntermediate, 1, 0.8);
            rigRotation("RightThumbDistal", riggedRightHand.RightThumbDistal, 1, 0.8);
            rigRotation("RightLittleProximal", riggedRightHand.RightLittleProximal, 1, 0.8);
            rigRotation("RightLittleIntermediate", riggedRightHand.RightLittleIntermediate, 1, 0.8);
            rigRotation("RightLittleDistal", riggedRightHand.RightLittleDistal, 1, 0.8);
          }
        }
        
        document.getElementById('status').textContent = 'Tracking: ' + status.join(' | ');
      };
      
      // ==================== MAIN APP ====================
      class AvatarApp {
        constructor() {
          this.video = document.getElementById('webcam');
          this.debugVideo = document.getElementById('debug-video');
          this.canvas = document.getElementById('avatar-canvas');
          this.loadingEl = document.getElementById('loading');
          this.loadingText = document.getElementById('loading-text');
          
          videoElement = this.video;
          
          this.scene = null;
          this.camera = null;
          this.renderer = null;
          this.clock = null;
          this.holistic = null;
          
          this.vrmUrl = 'https://cdn.glitch.global/29e07830-2317-4b15-a044-135e73c7f840/AliciaSolid.vrm?v=1692567174619';
        }
        
        async init() {
          try {
            this.updateLoading('Requesting camera access...');
            await this.setupCamera();
            
            this.updateLoading('Setting up 3D scene...');
            this.setupThreeJS();
            
            this.updateLoading('Loading avatar model...');
            await this.loadVRM();
            
            this.updateLoading('Initializing holistic tracking...');
            await this.setupHolistic();
            
            this.updateLoading('Starting...');
            await this.start();
            
            this.loadingEl.classList.add('hidden');
          } catch (error) {
            console.error('Initialization error:', error);
            this.loadingText.textContent = 'Error: ' + error.message;
          }
        }
        
        updateLoading(text) {
          this.loadingText.textContent = text;
          console.log(text);
        }
        
        async setupCamera() {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 480, facingMode: 'user' }
          });
          this.video.srcObject = stream;
          this.debugVideo.srcObject = stream;
          await new Promise(r => this.video.onloadedmetadata = r);
        }
        
        setupThreeJS() {
          const width = window.innerWidth;
          const height = window.innerHeight;
          
          this.scene = new THREE.Scene();
          this.camera = new THREE.PerspectiveCamera(30, width / height, 0.1, 1000);
          this.camera.position.set(0, 1.4, 4);
          
          this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: true });
          this.renderer.setSize(width, height);
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          this.renderer.setClearColor(0x000000, 1);  // Black background
          this.renderer.shadowMap.enabled = true;
          this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          
          // OrbitControls for interactive 3D view (rotate, zoom, pan)
          this.controls = new THREE.OrbitControls(this.camera, this.canvas);
          this.controls.target.set(0, 0.9, 0);  // Look at avatar center
          this.controls.enableDamping = true;
          this.controls.dampingFactor = 0.05;
          this.controls.minDistance = 1;
          this.controls.maxDistance = 20;
          this.controls.maxPolarAngle = Math.PI / 2 + 0.3;  // Limit looking below floor
          this.controls.update();
          
          // Create star field
          const starGeometry = new THREE.BufferGeometry();
          const starCount = 1000;
          const starPositions = new Float32Array(starCount * 3);
          for (let i = 0; i < starCount * 3; i += 3) {
            starPositions[i] = (Math.random() - 0.5) * 100;     // x
            starPositions[i + 1] = Math.random() * 50 + 5;      // y (above ground)
            starPositions[i + 2] = (Math.random() - 0.5) * 100; // z
          }
          starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
          const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, sizeAttenuation: true });
          const stars = new THREE.Points(starGeometry, starMaterial);
          this.scene.add(stars);
          
          // Lighting - brighter for better visibility
          const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
          directionalLight.position.set(2, 4, 2);
          directionalLight.castShadow = true;
          directionalLight.shadow.mapSize.width = 1024;
          directionalLight.shadow.mapSize.height = 1024;
          directionalLight.shadow.camera.near = 0.1;
          directionalLight.shadow.camera.far = 10;
          directionalLight.shadow.camera.left = -2;
          directionalLight.shadow.camera.right = 2;
          directionalLight.shadow.camera.top = 2;
          directionalLight.shadow.camera.bottom = -2;
          this.scene.add(directionalLight);
          
          // Add front fill light
          const frontLight = new THREE.DirectionalLight(0xffffff, 0.4);
          frontLight.position.set(0, 2, 4);
          this.scene.add(frontLight);
          
          this.scene.add(new THREE.AmbientLight(0xffffff, 0.5));
          
          // Back light for rim lighting effect
          const backLight = new THREE.DirectionalLight(0x6699cc, 0.3);
          backLight.position.set(-1, 2, -2);
          this.scene.add(backLight);
          
          // ==================== 3D GRID FLOOR ====================
          // Solid grey floor plane
          const floorGeometry = new THREE.PlaneGeometry(20, 20);
          const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x555555,
            roughness: 0.8,
            metalness: 0.2
          });
          const floor = new THREE.Mesh(floorGeometry, floorMaterial);
          floor.rotation.x = -Math.PI / 2;
          floor.position.y = 0;
          floor.receiveShadow = true;
          this.scene.add(floor);
          
          // Grid lines on top of floor
          const gridHelper = new THREE.GridHelper(20, 40, 0x888888, 0x444444);
          gridHelper.position.y = 0.01;
          this.scene.add(gridHelper);
          
          // Ground plane for shadows
          const groundGeometry = new THREE.PlaneGeometry(12, 12);
          const groundMaterial = new THREE.ShadowMaterial({ opacity: 0.5 });
          const ground = new THREE.Mesh(groundGeometry, groundMaterial);
          ground.rotation.x = -Math.PI / 2;
          ground.position.y = 0.02;
          ground.receiveShadow = true;
          this.scene.add(ground);
          
          this.clock = new THREE.Clock();
          
          window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
          });
        }
        
        async loadVRM() {
          const loader = new THREE.GLTFLoader();
          loader.crossOrigin = "anonymous";
          
          return new Promise((resolve, reject) => {
            loader.load(
              this.vrmUrl,
              async (gltf) => {
                try {
                  const vrm = await THREE_VRM.VRM.from(gltf);
                  this.scene.add(vrm.scene);
                  currentVrm = vrm;
                  currentVrm.scene.rotation.y = Math.PI; // Face camera
                  
                  // Set avatar position: feet on floor (Y=0)
                  currentVrm.scene.position.set(0, 0, 0);
                  
                  // Enable shadows on avatar
                  vrm.scene.traverse((obj) => {
                    if (obj.isMesh) {
                      obj.castShadow = true;
                      obj.receiveShadow = true;
                    }
                  });
                  
                  resolve();
                } catch (e) { reject(e); }
              },
              (progress) => {
                if (progress.total > 0) {
                  this.updateLoading(`Loading avatar... ${Math.round(progress.loaded / progress.total * 100)}%`);
                }
              },
              reject
            );
          });
        }
        
        async setupHolistic() {
          this.holistic = new Holistic({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5.1635989137/${file}`
          });
          
          this.holistic.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7,
            refineFaceLandmarks: true
          });
          
          this.holistic.onResults((results) => {
            animateVRM(results);
          });
        }
        
        async start() {
          const camera = new Camera(this.video, {
            onFrame: async () => {
              await this.holistic.send({ image: this.video });
            },
            width: 640,
            height: 480
          });
          await camera.start();
          this.animate();
        }
        
        animate() {
          requestAnimationFrame(() => this.animate());
          
          // Update OrbitControls for smooth interaction
          if (this.controls) {
            this.controls.update();
          }
          
          if (currentVrm) {
            currentVrm.update(this.clock.getDelta());
          }
          
          this.renderer.render(this.scene, this.camera);
        }
      }
      
      window.addEventListener('DOMContentLoaded', () => {
        new AvatarApp().init();
      });
    </script>
  </body>
</html>
